services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    environment:
      CI_ENVIRONMENT: ${CI_ENVIRONMENT:-development}
      APP_URL: ${APP_URL:-}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ot_taller}
      DB_USER: ${DB_USER:-ot_taller}
      DB_PASS: ${DB_PASS:-ot_taller}
      SETUP_TOKEN: ${SETUP_TOKEN:-local-setup}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    depends_on:
      db:
        condition: service_healthy

  db:
    # Oracle Linux 8 mantiene compatibilidad con CPUs x86-64 antiguas.
    # La imagen mysql:8.0 usa Oracle Linux 9 y requiere x86-64-v2 (SSE4.2).
    image: ${DB_IMAGE:-mysql:8.0-oraclelinux8}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root}
      MYSQL_DATABASE: ${DB_NAME:-ot_taller}
      MYSQL_USER: ${DB_USER:-ot_taller}
      MYSQL_PASSWORD: ${DB_PASS:-ot_taller}
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - "127.0.0.1:${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER:-ot_taller}
      PMA_PASSWORD: ${DB_PASS:-ot_taller}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  vendor_data:
